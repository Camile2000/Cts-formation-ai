0;letter-spacing:.06em;color:var(--vert-f);background:var(--blanc);border:1px solid var(--vert-f);padding:8px 14px;display:inline-block;margin:6px 0}.agree{display:flex;gap:10px;align-items:flex-start;margin:12px 0;cursor:pointer}.agree input{width:20px;height:20px;margin-top:3px;accent-color:#1E5E24}@media (max-width:520px){.whoform input{width:150px}.res{flex-direction:column;align-items:flex-start}}</style></head><body><div class="topbar"></div><header class="site"><div class="wrap head-in"><img src="logo.png" alt="Camerounaise de Transport et de Services S.A."><div class="doc-ref"><b>Programme de formation interne</b>Utilisation de ChatGPT · Version 1.0 · novembre 2026<div id="who"></div></div></div></header><div class="wrap layout"><aside id="toc"><details id="tocd"><summary>Sommaire</summary><div id="tocin"></div></details></aside><main id="app"></main></div><footer class="site"><div class="wrap in"><div style="background:#1e5e24"><img src="logo-neg.png" alt="Camerounaise de Transport et de Services S.A."></div><p>Bonamoussadi, carrefour Yoro Joss · BP 2603, Douala<br>+237 690 29 98 44 · +237 679 33 97 08 · Camtranserv@gmail.com<br>© 2026 CTS SA. Tous droits réservés.<br><a href="#admin" style="color:#fff">Administration</a></p></div></footer><script>var S={done:{},poste:"secretariat",quiz:{},checks:{}};try{var raw=localStorage.getItem("cts-ia");raw&&(S=Object.assign(S,JSON.parse(raw)))}catch(e){}function save(){try{localStorage.setItem("cts-ia",JSON.stringify(S))}catch(e){}}var W={light:{},flag:{},verified:!1,calc:[{t:"Rédaction d'un compte rendu",a:45,b:15,f:2},{t:"Relances de factures",a:30,b:10,f:3},{t:"Courriers aux partenaires",a:20,b:8,f:5}]},PROMPTS=[];function $(e,t){return(t||document).querySelector(e)}function esc(e){return String(e).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}var CHECK='<svg viewBox="0 0 14 14"><path d="M2 7.5l3.2 3.2L12 3.5" fill="none" stroke="#fff" stroke-width="2.4"/></svg>',POSTES={secretariat:{nom:"Secrétariat"},compta:{nom:"Comptabilité"}},ATELIERS={secretariat:[{titre:"Rédiger rapidement et correctement",objectif:"Rédiger un courrier électronique ou un courrier postal clair en moins de cinq minutes.",etapes:["Choisissez un courrier réel à envoyer cette semaine, sans donnée sensible.","Rédigez la demande selon la méthode RCTF.","Demandez une version plus courte, puis une version plus formelle.","Relisez les noms, les dates et les montants. Corrigez à la main si nécessaire."],prompt:{titre:"Courrier électronique professionnel",texte:"Vous êtes secrétaire de direction dans une société camerounaise de location de matériel de transport d'hydrocarbures.\nContexte : je dois écrire à [destinataire] au sujet de [objet].\nTâche : rédigez un courrier électronique poli et clair.\nFormat : 6 lignes maximum, ton formel, avec une demande de réponse avant le [date]."},exercice:"Rédigez deux courriers réels avec ChatGPT. Notez le temps passé et comparez-le à votre méthode habituelle.",piege:"Envoyer sans relire. ChatGPT peut modifier un nom, une date ou une formule de politesse.",check:["Je sais rédiger une demande RCTF pour un courrier","Je sais demander une version plus courte ou plus formelle","Je relis toujours noms, dates et montants avant l'envoi"]},{titre:"Établir un compte rendu en dix minutes",objectif:"Transformer des notes brutes ou une dictée en compte rendu structuré.",etapes:["Prenez des notes pendant la réunion, ou dictez-les avec le micro du téléphone.","Collez les notes dans ChatGPT avec la consigne ci-dessous.","Vérifiez que chaque action a un responsable et une échéance.","Enregistrez le résultat dans votre dossier, sous un titre daté."],prompt:{titre:"Compte rendu de réunion",texte:"Voici mes notes brutes de réunion : [coller les notes].\nTransformez-les en compte rendu avec : participants, décisions prises, actions (qui, quoi, avant quand).\nFormat : un tableau pour les actions, une page maximum.\nN'inventez rien : si une information manque, écrivez « à préciser »."},exercice:"Reprenez les notes de la dernière réunion de votre équipe et établissez le compte rendu. Faites-le relire par un collègue.",piege:"Laisser ChatGPT attribuer une action à une personne ou fixer une date de sa propre initiative. La consigne « à préciser » l'évite.",check:["Je sais transformer des notes en compte rendu","Je demande toujours : qui, quoi, avant quand","J'ai testé la dictée vocale"]},{titre:"Cas pratique : modèle de courrier et traduction",objectif:"Créer un modèle de courrier réutilisable et en obtenir la version anglaise.",etapes:["Choisissez un courrier que vous rédigez souvent (relance, convocation, confirmation).","Demandez un modèle comportant des champs [entre crochets].","Demandez la version en anglais britannique, puis relisez-la attentivement.","Enregistrez le modèle dans votre dossier personnel."],prompt:{titre:"Modèle de courrier et traduction",texte:"Créez un modèle de courrier de relance à un partenaire au sujet de [sujet], avec des champs [entre crochets] à compléter.\nTon : formel et courtois. Longueur : 10 lignes maximum.\nDonnez ensuite la version en anglais britannique du même courrier."},exercice:"Constituez deux modèles de courrier pour votre poste. Ils serviront à toute l'équipe.",piege:"Envoyer une traduction sans relecture lorsque l'enjeu est important (contrat, litige).",check:["J'ai un modèle de courrier réutilisable dans mon dossier","Je sais demander une traduction et la relire","Je partage mes meilleurs modèles avec l'équipe"]}],compta:[{titre:"Comprendre et contrôler les tableaux",objectif:"Utiliser ChatGPT pour expliquer une formule Excel et repérer des anomalies.",etapes:["Prélevez un extrait de dix lignes de votre tableau, sans nom de client.","Demandez à ChatGPT de contrôler la cohérence entre HT, TVA et TTC.","Recalculez vous-même trois lignes dans Excel pour confirmer.","Notez les erreurs repérées et celles que l'outil a manquées."],prompt:{titre:"Contrôle HT, TVA, TTC",texte:"Je suis comptable. Voici un extrait de factures (montant HT, TVA, TTC), sans nom de client : [coller 10 lignes].\nLe taux de TVA appliqué est de 19,25 %.\nContrôlez la cohérence de chaque ligne et listez les lignes suspectes dans un tableau (ligne, anomalie, correction proposée).\nN'inventez rien et signalez ce dont vous n'êtes pas sûr."},exercice:"Contrôlez un lot de dix factures anonymisées. Comparez le résultat avec votre propre contrôle.",piege:"Se fier à un calcul de ChatGPT. Les chiffres se recalculent toujours dans Excel. Le taux de TVA appliqué doit être vérifié.",check:["Je sais anonymiser un extrait avant de le coller","Je recalcule toujours les chiffres importants","Je sais demander une formule Excel et la tester"]},{titre:"Relances et courriers financiers",objectif:"Rédiger des relances de factures impayées selon plusieurs niveaux de ton.",etapes:["Rassemblez les informations utiles : numéro de facture, montant, date d'échéance, sans donnée superflue.","Demandez trois versions : amiable, ferme, dernier avis.","Retenez la version adaptée au client et ajustez-la.","Faites valider les relances sensibles par votre responsable."],prompt:{titre:"Relance de facture à trois niveaux",texte:"Vous êtes comptable dans une société de transport au Cameroun.\nContexte : la facture n° [numéro] d'un montant de [montant] FCFA est impayée depuis [nombre] jours.\nTâche : rédigez trois courriers de relance : amiable, ferme, dernier avis avant action.\nFormat : 5 lignes maximum par courrier, ton poli, avec un délai de paiement précis."},exercice:"Préparez les trois niveaux de relance pour un cas réel et classez-les dans votre dossier.",piege:"Envoyer un dernier avis ou une mise en demeure sans validation. Ces courriers engagent la société.",check:["Je sais demander trois niveaux de ton","Je fais valider les courriers sensibles","J'ai mes modèles de relance dans mon dossier"]},{titre:"Cas pratique : analyser un écart de rapprochement",objectif:"Faire analyser un écart et obtenir des pistes à vérifier.",etapes:["Préparez un tableau anonymisé reprenant les lignes de l'écart.","Demandez à ChatGPT de regrouper les lignes et de proposer des causes possibles.","Vérifiez chaque piste dans vos pièces comptables.","Consignez la cause réelle une fois trouvée."],prompt:{titre:"Analyse d'un écart",texte:"Voici un tableau anonymisé de [nombre] lignes présentant un écart de rapprochement : [coller le tableau].\nTâche : regroupez les lignes par type, repérez les doublons ou les montants proches, et proposez trois causes probables.\nFormat : un tableau (cause possible, lignes concernées, méthode de vérification).\nPrécisez qu'il s'agit de pistes et non de certitudes."},exercice:"Choisissez un écart réel du mois, anonymisez-le et appliquez la méthode. Notez le temps gagné.",piege:"Prendre une piste pour une preuve. Les causes proposées se vérifient dans les pièces.",check:["Je sais anonymiser un tableau complet","Je vérifie chaque piste dans mes pièces","Je note le temps gagné pour le bilan"]}]},SESSIONS=[{n:1,bloc:1,titre:"Comprendre ChatGPT et ses usages à CTS",objectif:"Expliquer en deux phrases ce que fait ChatGPT et ce qu'il ne sait pas faire, puis envoyer une première demande.",retenir:["ChatGPT est un assistant qui lit et écrit du texte. Il fonctionne comme un stagiaire très rapide : il a beaucoup lu, mais il ne connaît pas CTS.","Il sert à gagner du temps pour rédiger, résumer, organiser et expliquer. Les décisions et les relations restent humaines.","Il peut se tromper avec assurance. Toute réponse se relit.","La règle de base : demander, lire, vérifier, améliorer."],widget:"loop",activites:[["Connexion et prise en main de l'écran","Ouvrez ChatGPT et repérez la zone de saisie, le bouton « nouvelle conversation », le menu des dossiers, le micro et la pièce jointe."],["Première demande","Collez un message WhatsApp que vous auriez adressé à un collègue et demandez : « Reformulez ce message en message professionnel, poli et court »."],["Vrai ou faux","En groupe, classez six affirmations sur ChatGPT (il sait tout, il ne se trompe jamais, il remplace le comptable…)."]],prompt:{titre:"Première demande",texte:"Reformulez ce message en message professionnel, poli et court : « [votre message] »"},quiz:!0},{n:2,bloc:1,titre:"Formuler une demande : la méthode RCTF",objectif:"Transformer une demande vague en demande précise : Rôle, Contexte, Tâche, Format.",retenir:["Plus la demande est précise, plus la réponse est exploitable.","R, Rôle : qui répond. C, Contexte : la situation. T, Tâche : le résultat attendu. F, Format : la forme de la réponse.","Ajoutez toujours une consigne de prudence : « N'inventez rien »."],widget:"builder",activites:[["Atelier « demande vague »","Transformez trois demandes vagues en demandes RCTF : « écris un courrier », « résume ceci », « fais un tableau »."],["Avec le constructeur","Utilisez le constructeur ci-dessus avec une tâche réelle de votre poste, puis collez le résultat dans ChatGPT."],["Comparaison","Envoyez la demande vague, puis la demande RCTF. Comparez les deux réponses en groupe."]],prompt:{titre:"Modèle RCTF",texte:"Rôle : vous êtes [poste] dans une société camerounaise de location de matériel de transport d'hydrocarbures.\nContexte : [la situation, les informations utiles].\nTâche : [le résultat attendu].\nFormat : [tableau, 5 puces, 6 lignes maximum…].\nN'inventez rien. Si une information manque, posez-moi la question."},quiz:!0},{n:3,bloc:1,titre:"Dialoguer, corriger, vérifier",objectif:"Améliorer une réponse en plusieurs échanges et repérer les éléments à vérifier.",retenir:["Ne recommencez pas à zéro : poursuivez la conversation. « Plus court », « plus formel », « ajoutez un tableau », « expliquez plus simplement ».","Demandez à ChatGPT de vous poser des questions avant de répondre.","Il peut inventer des chiffres, des noms, des lois et des dates. On parle d'hallucination.","Règle des trois vérifications : les chiffres, les noms et les dates, les références (lois, normes)."],widget:"verify",activites:[["Améliorer en trois échanges","Reprenez une réponse de ChatGPT et améliorez-la en trois échanges : plus court, plus simple, avec un tableau."],["Laisser l'outil poser les questions","Utilisez la demande ci-dessous pour une tâche réelle et répondez aux questions posées."],["Recherche d'erreurs","Réalisez l'exercice ci-dessus, puis cherchez une erreur dans une réponse réelle."]],prompt:{titre:"Demande de questions préalables",texte:"Avant de répondre, posez-moi toutes les questions dont vous avez besoin pour faire ce travail correctement. N'inventez rien. Si vous n'êtes pas sûr d'une information, dites-le-moi."},quiz:!0},{n:4,bloc:1,titre:"Sécurité et règles d'usage",objectif:"Savoir ce qui peut être collé dans ChatGPT, ce qui doit être anonymisé et ce qui reste interdit.",retenir:["Le compte est partagé : ce que vous écrivez peut être vu par les autres utilisateurs du compte.","Trois catégories : autorisé, à anonymiser d'abord, interdit.","Chaque agent travaille dans son dossier, avec des conversations titrées : AAAA-MM-JJ_Sujet.","Le dossier d'un collègue ne se modifie ni ne se supprime."],widget:"light",activites:[["Classement des situations","Classez chaque situation ci-dessus, puis discutez des écarts en groupe."],["Anonymisation","Prenez une facture ou un courrier réel. Retirez les noms, adresses et montants sensibles. Comparez entre agents."],["Mon dossier","Créez votre dossier personnel nommé « POSTE – Prénom » et ouvrez votre première conversation avec un titre daté."]],prompt:{titre:"Test d'anonymisation",texte:"Voici un texte dont j'ai retiré les noms et les montants : [texte]. Rédigez une version prête à l'envoi, avec des champs [entre crochets] à compléter pour les noms et les montants."},quiz:!0},{n:5,bloc:1,titre:"Fichiers, photos et dictée vocale",objectif:"Joindre un document, une photo ou dicter à la voix, puis vérifier le résultat.",retenir:["Vous pouvez joindre un PDF, un document Word, un fichier Excel ou une photo, puis demander un résumé, un tableau ou une explication.","Le micro du téléphone permet de dicter : pratique pour les notes et les rapports.","Relisez toujours : noms, numéros et chiffres sont souvent mal compris ou mal extraits.","Les mêmes règles de classement s'appliquent aux fichiers."],widget:"ways",activites:[["Résumer un document","Joignez un document public ou une note interne sans donnée sensible. Demandez : « Résumez en 5 points et listez les 3 actions à mener »."],["Dicter","Dictez une minute de notes avec le micro, puis demandez une version propre."],["Bilan de la semaine 1","Chacun présente sa meilleure demande de la semaine et ce qu'il a vérifié."]],prompt:{titre:"Résumer un document",texte:"Résumez ce document en 5 points clés, puis listez les 3 actions à mener. Précisez les informations qui vous semblent incertaines. N'inventez rien."},quiz:!0},{n:6,bloc:2,atelier:0,titre:"Atelier métier 1 : les tâches clés",objectif:"Appliquer la méthode RCTF à la tâche la plus fréquente du poste."},{n:7,bloc:2,atelier:1,titre:"Atelier métier 2 : la bibliothèque de demandes",objectif:"Créer et enregistrer les demandes réutilisées chaque semaine."},{n:8,bloc:2,atelier:2,titre:"Atelier métier 3 : un cas réel de bout en bout",objectif:"Traiter une tâche réelle du poste avec ChatGPT, de la demande à la vérification."},{n:9,bloc:3,titre:"Intégrer ChatGPT au travail quotidien",objectif:"Choisir les bonnes tâches, mesurer le gain de temps et installer une routine.",retenir:["Avant chaque tâche, posez-vous la question : ChatGPT peut-il m'aider ?","Tâches adaptées : répétitives, rédigées, structurées. À éviter : décisions, relations, données confidentielles.","Conservez une bibliothèque de demandes dans votre dossier.","Chaque vendredi, quinze minutes : chacun présente la demande de la semaine."],widget:"calc",activites:[["Cinq tâches de la semaine","Listez cinq tâches de votre semaine et classez-les : à confier à ChatGPT, à faire avec ChatGPT, à conserver."],["Calcul du gain de temps","Complétez le tableau ci-dessus avec vos durées réelles avant et après."],["Ma bibliothèque","Enregistrez cinq demandes dans votre dossier. Choisissez celle que vous présenterez vendredi."]],prompt:{titre:"Identifier les tâches adaptées",texte:"Je suis [poste]. Voici mes tâches de la semaine : [liste].\nClassez-les en trois groupes : à confier à ChatGPT, à faire avec ChatGPT, à conserver. Justifiez brièvement chaque choix."},quiz:!0},{n:10,bloc:3,titre:"Examen final et plan d'action à 30 jours",objectif:"Valider les acquis et définir son plan d'action personnel.",retenir:["L'examen final comporte 12 questions tirées au sort, 25 minutes, une seule tentative.","Seuil de validation : 8 bonnes réponses sur 12.","Le plan d'action fixe ce que chacun met en œuvre dans les 30 jours suivants."],widget:"plan"}],COMMUN_PROMPTS=[{titre:"Reformuler un message",texte:"Reformulez ce message en message professionnel, poli et court : « [votre message] »"},{titre:"Modèle RCTF",texte:"Rôle : vous êtes [poste] dans une société camerounaise de location de matériel de transport d'hydrocarbures.\nContexte : [la situation].\nTâche : [le résultat attendu].\nFormat : [tableau, 5 puces, 6 lignes maximum].\nN'inventez rien. Si une information manque, posez-moi la question."},{titre:"Questions préalables",texte:"Avant de répondre, posez-moi toutes les questions dont vous avez besoin. N'inventez rien. Si vous n'êtes pas sûr, dites-le-moi."},{titre:"Résumer un document",texte:"Résumez ce document en 5 points clés, puis listez les 3 actions à mener. Précisez ce qui vous semble incertain."}],CHARTE=[["Un dossier par agent","Chacun travaille dans son dossier nommé « POSTE – Prénom ». Le dossier d'un autre agent ne se modifie pas."],["Conversations datées","Titre : AAAA-MM-JJ_Sujet. Exemple : 2026-12-01_Relance facture."],["Pas de données sensibles","Ni mots de passe, ni contrats, ni tarifs, ni salaires, ni données personnelles. Anonymiser avant de coller."],["Relecture systématique","Chiffres, noms, dates et références se vérifient avant tout envoi."],["Décision humaine","ChatGPT aide à préparer. La décision et la signature restent humaines."],["Partage des bonnes pratiques","Chaque vendredi, un agent présente la demande de la semaine."]],LAUNCH=["Désigner l'administrateur du compte, seul détenteur du mot de passe","Examiner l'offre : un compte équipe avec un siège par personne est plus sûr qu'un identifiant partagé","Désactiver la mémoire et l'utilisation des conversations pour l'entraînement (réglages, contrôle des données)","Créer un dossier par agent : « POSTE – Prénom »","Valider et diffuser les règles d'usage","Préparer cinq tâches réelles par poste (secrétariat, comptabilité) pour les ateliers","Vérifier que chaque agent dispose d'un téléphone ou d'un ordinateur connecté pendant les séances","Programmer le rendez-vous du vendredi (15 minutes) pour les quatre semaines suivantes"];function promptBlock(e,t){PROMPTS.push(t);var s=PROMPTS.length-1;return'<div class="prompt"><div class="prompt-h"><span>'+esc(e)+'</span><button class="btn sm" data-act="copy" data-p="'+s+'">Copier</button></div><pre>'+esc(t)+"</pre></div>"}function checkItem(e,t){var s=!!S.checks[e];return'<button class="chk'+(s?" on":"")+'" data-act="check" data-k="'+e+'" aria-pressed="'+s+'"><i>'+CHECK+"</i><span>"+esc(t)+"</span></button>"}function checklist(e,t){return t.map(function(t,s){return checkItem(e+"_"+s,t)}).join("")}function svgLoop(){var e=[20,200,380,560],t="";return[["1","Demander"],["2","Lire"],["3","Vérifier"],["4","Améliorer"]].forEach(function(s,a){t+='<rect class="s-box" x="'+e[a]+'" y="64" width="140" height="62" rx="2"/><text class="s-n" x="'+(e[a]+70)+'" y="86">'+s[0]+'</text><text class="s-t" x="'+(e[a]+70)+'" y="111">'+s[1]+"</text>",a<3&&(t+='<path class="s-arrow" d="M'+(e[a]+144)+" 95 L"+(e[a+1]-6)+' 95" marker-end="url(#ah)"/>')}),'<figure class="figure" style="margin:0"><svg viewBox="0 0 720 150" role="img" aria-label="Cycle de travail : demander, lire, vérifier, améliorer"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E5E24"/></marker></defs>'+(t+='<path class="s-arrow" d="M630 60 L630 22 L90 22 L90 58" marker-end="url(#ah)"/><text class="s-m" x="360" y="16">Le cycle se répète jusqu\'à obtenir un résultat fiable</text>')+"</svg><figcaption>Figure 1. Cycle de travail avec ChatGPT.</figcaption></figure>"}var ICONS={doc:'<svg viewBox="0 0 48 48"><path class="ic" d="M12 6h16l10 10v26H12z"/><path class="ic" d="M28 6v10h10M18 26h14M18 32h14"/></svg>',photo:'<svg viewBox="0 0 48 48"><rect class="ic" x="6" y="10" width="36" height="28"/><rect class="ic" x="14" y="17" width="7" height="7"/><path class="ic" d="M6 35l12-10 10 8 6-5 8 7"/></svg>',mic:'<svg viewBox="0 0 48 48"><rect class="ic" x="18" y="5" width="12" height="22"/><path class="ic" d="M12 23v3a12 12 0 0 0 24 0v-3M24 38v5M18 43h12"/></svg>',table:'<svg viewBox="0 0 48 48"><rect class="ic" x="6" y="9" width="36" height="30"/><path class="ic" d="M6 19h36M6 29h36M20 9v30"/></svg>'};function wLoop(){return"<h2>Principe de travail</h2>"+svgLoop()+'<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Points forts</h3><ul class="clean"><li>Reformuler, corriger, traduire</li><li>Résumer un long texte</li><li>Mettre en forme un tableau ou un plan</li><li>Expliquer une formule Excel</li></ul></div><div class="card red"><h3>Limites</h3><ul class="clean"><li>Il ne connaît pas CTS, ses clients ni ses contrats</li><li>Il ne garantit pas l\'exactitude d\'un chiffre</li><li>Il peut citer une loi ou une norme de façon erronée</li><li>Il ne décide pas à la place de l\'agent</li></ul></div></div>'}function wBuilder(){return'<h2>Les quatre éléments</h2><div class="rctf"><div><b>R</b><span>Rôle : qui répond ?</span></div><div><b>C</b><span>Contexte : quelle situation ?</span></div><div><b>T</b><span>Tâche : quel résultat ?</span></div><div><b>F</b><span>Format : quelle forme ?</span></div></div><div class="vs"><div class="card weak"><h3>Demande vague</h3><q>« Écris un courrier pour un retard. »</q><small>Résultat : un courrier générique, sans destinataire, trop long, à réécrire.</small></div><div class="card"><h3>Demande RCTF</h3><q>« Vous êtes secrétaire de direction. Écrivez à un client pour annoncer un retard de livraison de deux jours. Ton poli, 5 lignes, avec des excuses et une nouvelle date. »</q><small>Résultat : un courrier utilisable après relecture.</small></div></div><h2>Constructeur de demande</h2><div class="card alt"><div class="pills"><button class="pill" data-act="preset" data-v="s">Exemple secrétariat</button><button class="pill" data-act="preset" data-v="c">Exemple comptabilité</button></div><div class="field"><label for="b-r">Rôle <small>qui répond</small></label><input type="text" id="b-r" placeholder="Vous êtes secrétaire de direction dans une société de transport"></div><div class="field"><label for="b-c">Contexte <small>la situation</small></label><textarea id="b-c" placeholder="Un client attend sa livraison…"></textarea></div><div class="field"><label for="b-t">Tâche <small>le résultat attendu</small></label><input type="text" id="b-t" placeholder="Rédigez un courrier d\'excuses"></div><div class="field"><label for="b-f">Format <small>la forme</small></label><input type="text" id="b-f" placeholder="5 lignes, ton poli"></div><div class="prompt" id="b-box"><div class="prompt-h"><span>Demande prête à copier</span><button class="btn sm" data-act="copy-b">Copier</button></div><pre id="b-out"></pre></div></div>'}function builderText(){var e=function(e,t){var s=($("#"+e)||{}).value;return s&&s.trim()?s.trim():t};return"Rôle : "+e("b-r","[à compléter]")+"\nContexte : "+e("b-c","[à compléter]")+"\nTâche : "+e("b-t","[à compléter]")+"\nFormat : "+e("b-f","[à compléter]")+"\nN'inventez rien. Si une information manque, posez-moi la question."}function updateBuilder(){var e=$("#b-out");e&&(e.textContent=builderText())}var VERIFY=[{t:"Un wagon se compos
